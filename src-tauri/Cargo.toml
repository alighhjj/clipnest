[package]
name = "clipnest"
version = "0.1.0"
description = "跨平台剪贴板历史管理器"
authors = ["ClipNest"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clipnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 是 convertFileSrc / asset 协议读取本地缩略图的前提
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 把 SQLite 一起编进二进制，用户机器上不需要额外依赖
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3.4"

sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
