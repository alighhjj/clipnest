[package]
name = "clipnest"
version = "0.1.0"
description = "跨平台剪贴板历史管理器"
authors = ["ClipNest"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clipnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 是 convertFileSrc / asset 协议读取本地缩略图的前提
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 把 SQLite 一起编进二进制，用户机器上不需要额外依赖
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3.4"

sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
# bmp 是给 clipboard.rs 里解析旧式 CF_DIB 用的：arboard 在 Windows 上
# 只认「自定义 PNG 格式」与 CF_DIBV5，CF_DIB 得我们自己读自己解。
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

[target.'cfg(windows)'.dependencies]
# 版本范围与 arboard 在 Windows 下的声明完全一致，保证依赖图里只有一个
# clipboard-win 节点（当前 Cargo.lock 锁在 5.4.1），不会重复编译。
# raw::get_vec / raw::is_format_avail / formats::CF_DIB 在 5.3.1 与 5.4.1 中签名相同。
clipboard-win = { version = "5.3.1", features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
